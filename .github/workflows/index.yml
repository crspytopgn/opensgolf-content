name: index

# Pull requests: checks every pack (pack.toml fields, free licence, no files of the original game, size).
# Pushes to main: rebuilds dist/*.zip and index.json from packs/ and commits them, so the game's "Find more..." lists the
# new packs within a minute or two.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["packs/**", "tools/**", ".github/workflows/index.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the packs
        if: github.event_name == 'pull_request'
        run: python3 tools/build_index.py --check
      - name: Build the index
        if: github.event_name != 'pull_request'
        run: python3 tools/build_index.py
      - name: Commit the index
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "opensgolf-index"
          git config user.email "opensgolf-index@users.noreply.github.com"
          git add index.json dist
          if git diff --cached --quiet; then echo "index unchanged"; else git commit -m "Rebuild the content index" && git push; fi
